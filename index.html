<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9622b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>حسابدار گربه‌ها</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#241f1a;--mu:#7a6f63;--bd:#e8dfd2;--ac:#d9622b;--gr:#1f8a4c;--rd:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171410;--card:#221d18;--tx:#f3ece3;--mu:#a69b8d;--bd:#363029;--ac:#f08a52;--gr:#4cc882;--rd:#ff7a6b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7;padding:12px;max-width:560px;margin-inline:auto}
h1{font-size:19px;margin:4px 0 10px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 100px}
label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px}
input,select,button{font:inherit;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;font-weight:700;cursor:pointer}
button.x{width:auto;background:none;color:var(--rd);padding:2px 8px}
.seg{display:flex;gap:6px}.seg button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-weight:500;padding:8px 4px;font-size:13px}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 8px}
.big{font-size:22px;font-weight:800}.mu{color:var(--mu);font-size:12px}.w{color:var(--ac);font-size:13px;min-height:20px}
.g{color:var(--gr)}.r{color:var(--rd)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}
.it{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.pane{display:none}.pane.on{display:block}
.mn{display:flex;align-items:center;gap:8px}.mn button{width:44px;flex:none}.mn b{flex:1;text-align:center;font-size:17px}
.pill{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;display:none;z-index:9}
</style>
</head>
<body>
<h1>🐱 حسابدار گربه‌ها</h1>
<div class="nav seg" id="nav">
<button data-v="add" class="on">➕ ثبت</button><button data-v="mon">📅 ماهانه</button><button data-v="prc">💰 قیمت</button><button data-v="set">💾 پشتیبان</button>
</div>

<div class="pane on" id="p-add">
<div class="card">
<div class="seg"><button id="tE" class="on">خرج</button><button id="tI">درآمد / فروش</button></div>
<label>نام (مثلاً خرید از مارکت، غذای گربه)</label><input id="nm" placeholder="نام تراکنش">
<label>توضیح / محل (اختیاری)</label><input id="wh" placeholder="مثلاً هایپر، دامپزشکی...">
<label>مبلغ (تومان)</label><input id="amt" inputmode="numeric" placeholder="۰" autocomplete="off">
<div class="w" id="aw"></div>
<label>تاریخ شمسی</label>
<div class="row"><select id="dd"></select><select id="dm"></select><select id="dy"></select></div>
<label>مربوط به</label>
<div class="seg"><button id="sC" class="on">🐱 گربه‌ها</button><button id="sO">👤 شخصی / سایر</button></div>
<button id="add" style="margin-top:12px;padding:12px">ثبت</button>
</div>
<div class="card"><h2>آخرین ثبت‌ها</h2><div id="recent"></div></div>
</div>

<div class="pane" id="p-mon">
<div class="card">
<div class="mn"><button id="nx">›</button><b id="mt"></b><button id="pv">‹</button></div>
<div id="ms"></div>
</div>
<div class="card"><h2>تراکنش‌های این ماه</h2><div id="ml"></div></div>
<div class="card"><h2>همه ماه‌ها</h2><div id="ma"></div></div>
</div>

<div class="pane" id="p-prc">
<div class="card">
<h2>⚙️ تنظیمات</h2>
<div class="row">
<div><label>تورم سالانه (٪)</label><input id="inf" inputmode="decimal"></div>
<div><label>تعداد گربه برای فروش</label><input id="cnt" inputmode="numeric"></div>
<div><label>سود دلخواه (٪)</label><input id="mar" inputmode="decimal"></div>
<div><label>ماه تا رسیدن پول</label><input id="mon" inputmode="decimal"></div>
</div>
</div>
<div class="card" id="pr"></div>
</div>

<div class="pane" id="p-set">
<div class="card">
<h2>💾 پشتیبان‌گیری</h2>
<p class="mu">اطلاعات خودکار روی همین دستگاه ذخیره می‌شه و آفلاین کار می‌کنه. برای اطمینان، گاهی فایل پشتیبان بگیرید.</p>
<button id="exp">دانلود فایل پشتیبان</button>
<label style="margin-top:12px">بازیابی از فایل پشتیبان</label>
<input id="imp" type="file" accept=".json,application/json">
</div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const norm=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const num=s=>parseFloat(norm(s).replace(/[^\d.]/g,''))||0;
const O=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
const T=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
const H=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
const SC=['','هزار','میلیون','میلیارد','تریلیون','کوادریلیون'];
function w3(n){const h=Math.floor(n/100),r=n%100,p=[];if(h)p.push(H[h]);if(r<20){if(r)p.push(O[r])}else p.push(T[Math.floor(r/10)]+(r%10?' و '+O[r%10]:''));return p.join(' و ')}
function words(n){if(!n)return'';const g=[];let i=0;while(n>0&&i<6){const x=n%1000;if(x)g.unshift((i==1&&x==1)?'هزار':w3(x)+(SC[i]?' '+SC[i]:''));n=Math.floor(n/1000);i++}return g.join(' و ')+' تومان'}
function toJ(gy,gm,gd){const m=[0,31,59,90,120,151,181,212,243,273,304,334],g2=gm>2?gy+1:gy;let d=355666+365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)+gd+m[gm-1],jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}const jm=d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),jd=d<186?1+d%31:1+(d-186)%30;return[jy,jm,jd]}
function toG(jy,jm,jd){jy+=1595;let d=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13;gm++){if(gd<=s[gm])break;gd-=s[gm]}return[gy,gm,gd]}
const now=new Date(),TJ=toJ(now.getFullYear(),now.getMonth()+1,now.getDate());
const ts=x=>{const g=toG(x.y,x.m,x.d);return new Date(g[0],g[1]-1,g[2],12).getTime()};
const ds=x=>x.d+' '+MN[x.m-1]+' '+x.y;

let S={tx:[],s:{inf:350,cnt:1,mar:30,mon:1}},typ='E',sec='C',cur={y:TJ[0],m:TJ[1]};
try{const o=JSON.parse(localStorage.getItem('cat_app_v2')||'null');if(o&&o.tx){S=o;S.s=Object.assign({inf:350,cnt:1,mar:30,mon:1},o.s)}}catch(e){}
const save=()=>{try{localStorage.setItem('cat_app_v2',JSON.stringify(S))}catch(e){}};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}

// date selects
$('dd').innerHTML=Array.from({length:31},(_,i)=>`<option value="${i+1}">${fa(i+1)}</option>`).join('');
$('dm').innerHTML=MN.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');
$('dy').innerHTML=Array.from({length:6},(_,i)=>{const y=TJ[0]-4+i;return`<option value="${y}">${String(y).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}</option>`}).join('');
$('dd').value=TJ[2];$('dm').value=TJ[1];$('dy').value=TJ[0];

// tabs
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.v))});
const seg=(a,b,fn)=>{$(a).onclick=()=>{$(a).classList.add('on');$(b).classList.remove('on');fn(a)}; $(b).onclick=()=>{$(b).classList.add('on');$(a).classList.remove('on');fn(b)}};
seg('tE','tI',id=>typ=id==='tE'?'E':'I');
seg('sC','sO',id=>sec=id==='sC'?'C':'O');

// amount input with commas + words
$('amt').oninput=e=>{const r=norm(e.target.value).replace(/\D/g,'').slice(0,15);e.target.value=r?Number(r).toLocaleString('fa-IR'):'';$('aw').textContent=words(Number(r)||0)};

$('add').onclick=()=>{
  const a=num($('amt').value);
  if(!a){$('amt').style.borderColor='var(--rd)';return}
  $('amt').style.borderColor='';
  const dy=+$('dy').value,dm=+$('dm').value,dd=Math.min(+$('dd').value,dm<=6?31:30);
  S.tx.push({id:Date.now()+''+Math.random(),t:typ,c:sec,n:$('nm').value.trim()||(typ==='I'?'درآمد':'خرج'),w:$('wh').value.trim(),a,y:dy,m:dm,d:dd});
  $('amt').value='';$('aw').textContent='';$('nm').value='';$('wh').value='';
  save();render();toast('ثبت شد ✓');
};
const del=id=>{if(confirm('این مورد حذف بشه؟')){S.tx=S.tx.filter(x=>x.id!==id);save();render()}};
window.del=del;
const key=x=>x.y*100+x.m, srt=(a,b)=>key(b)-key(a)||b.d-a.d;
const item=x=>`<div class="it"><div><b>${x.c==='C'?'🐱':'👤'} ${x.n}</b><div class="mu">${ds(x)}${x.w?' · '+x.w:''}</div></div><div style="white-space:nowrap"><b class="${x.t==='I'?'g':'r'}">${x.t==='I'?'+':'−'}${fa(x.a)}</b><button class="x" onclick="del('${x.id}')">✕</button></div></div>`;
const net=l=>l.reduce((s,x)=>s+(x.t==='I'?x.a:-x.a),0);
const sg=v=>`<b class="${v>=0?'g':'r'}" dir="ltr">${v<0?'−':''}${fa(Math.abs(v))}</b>`;
const kv=(a,b)=>`<div class="kv"><span>${a}</span>${b}</div>`;

function render(){
  const s=S.s;
  const L=[...S.tx].sort(srt);
  $('recent').innerHTML=L.slice(0,6).map(item).join('')||'<div class="mu">هنوز چیزی ثبت نشده.</div>';
  // monthly
  $('mt').textContent=MN[cur.m-1]+' '+String(cur.y).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const M=L.filter(x=>x.y===cur.y&&x.m===cur.m), I=M.filter(x=>x.t==='I'),E=M.filter(x=>x.t==='E');
  const ti=I.reduce((a,x)=>a+x.a,0),te=E.reduce((a,x)=>a+x.a,0),n=ti-te;
  $('ms').innerHTML=kv('درآمد ماه',`<b class="g">${fa(ti)}</b>`)+kv('خرج ماه',`<b class="r">${fa(te)}</b>`)+
   `<div class="pill"><div class="mu">${n>=0?'سود خالص این ماه':'زیان این ماه'}</div><div class="big ${n>=0?'g':'r'}">${fa(Math.abs(n))} تومان</div><div class="w">${words(Math.abs(Math.round(n)))}</div></div>`+
   kv('🐱 گربه‌ها',sg(net(M.filter(x=>x.c==='C'))))+kv('👤 شخصی / سایر',sg(net(M.filter(x=>x.c==='O'))));
  $('ml').innerHTML=M.map(item).join('')||'<div class="mu">تراکنشی در این ماه نیست.</div>';
  const keys=[...new Set(S.tx.map(key))].sort((a,b)=>b-a);
  $('ma').innerHTML=keys.map(k=>{const y=Math.floor(k/100),m=k%100,v=net(S.tx.filter(x=>key(x)===k));return`<div class="kv" onclick="goM(${y},${m})" style="cursor:pointer"><span>${MN[m-1]} ${String(y).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}</span>${sg(v)}</div>`}).join('')||'<div class="mu">—</div>';
  // price
  const yr=1+s.inf/100,mf=Math.pow(yr,1/12),cnt=Math.max(1,s.cnt);
  const adj=x=>x.a*Math.pow(yr,Math.max(0,(Date.now()-ts(x))/31536000000));
  const CE=S.tx.filter(x=>x.c==='C'&&x.t==='E');
  const ne=CE.reduce((a,x)=>a+x.a,0),ae=CE.reduce((a,x)=>a+adj(x),0);
  const per=ae/cnt,be=per*Math.pow(mf,s.mon),pr=be*(1+s.mar/100);
  const nom=net(S.tx),real=S.tx.reduce((a,x)=>a+(x.t==='I'?1:-1)*adj(x),0);
  $('pr').innerHTML=`<h2>💰 قیمت پیشنهادی فروش</h2>`+
   kv('هزینه‌های گربه‌ها (اسمی)',`<b>${fa(ne)}</b>`)+
   kv('همین هزینه‌ها به ارزش امروز',`<b>${fa(ae)}</b>`)+
   kv('ضریب تورم روی هزینه‌ها',`<b>×${(ne?ae/ne:1).toLocaleString('fa-IR',{maximumFractionDigits:2})}</b>`)+
   kv('هزینه هر گربه (ارزش امروز)',`<b>${fa(per)}</b>`)+
   kv('سر به سر (با تورم تا رسیدن پول)',`<b>${fa(be)}</b>`)+
   `<div class="pill"><div class="mu">قیمت پیشنهادی هر گربه (با ${fa(s.mar)}٪ سود)</div><div class="big" style="color:var(--ac)">${fa(pr)} تومان</div><div class="w">${words(Math.round(pr))}</div></div>`+
   `<h2 style="margin-top:16px">📊 کل سود (همه تراکنش‌ها)</h2>`+
   kv('سود/زیان اسمی',sg(nom))+kv('سود/زیان واقعی (به ارزش امروز)',sg(real))+
   `<div class="mu">تورم ماهانه معادل: ${(100*(mf-1)).toLocaleString('fa-IR',{maximumFractionDigits:1})}٪</div>`;
}
window.goM=(y,m)=>{cur={y,m};render();document.querySelector('#nav [data-v=mon]').click()};
$('pv').onclick=()=>{cur=cur.m===1?{y:cur.y-1,m:12}:{y:cur.y,m:cur.m-1};render()};
$('nx').onclick=()=>{cur=cur.m===12?{y:cur.y+1,m:1}:{y:cur.y,m:cur.m+1};render()};
['inf','cnt','mar','mon'].forEach(id=>{$(id).value=S.s[id];$(id).oninput=()=>{S.s[id]=num($(id).value);save();render()}});

// backup
$('exp').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cat-backup.json';a.click()};
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.tx)throw 0;S=o;S.s=Object.assign({inf:350,cnt:1,mar:30,mon:1},o.s);save();['inf','cnt','mar','mon'].forEach(id=>$(id).value=S.s[id]);render();toast('بازیابی شد ✓')}catch(x){toast('فایل نامعتبر است')}};r.readAsText(f)};
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
